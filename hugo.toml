baseURL = "http://localhost/"
title = "Kartik Homelab"
locale = "en-us"
summaryLength = "10"
theme = "hugo-clarity"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false

[params]
  defaultTheme = "dark"
  description = "Homelab setup guides, cheat sheets, and troubleshooting notes"
  mainSections = ["posts"]
  search = true
  code_copy_button = true
  sidebar = "right"

  [params.author]
    name = "Kartik"
    email = "kartik@example.com"

  [params.widgets]
    sidebar = ["toc"]

